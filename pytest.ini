[pytest]
testpaths = tests
addopts = -ra
# 默认实时输出 INFO 日志：
#   * tests logger：每条用例显式记录的输入数据与判定依据（见 conftest._log_case）
#   * market_tick.service logger：服务侧实际收到的批次/修正负载与判定结果
# 需要安静输出时可加 -p no:logging 或 --log-cli-level=WARNING 覆盖。
log_cli = 1
log_cli_level = INFO
log_cli_format = %(name)s | %(message)s
log_cli_date_format = %H:%M:%S
filterwarnings =
    ignore::DeprecationWarning
